<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var l=localStorage.getItem("mc-lang");if(l!=="ar"&&l!=="en"){l="en";}document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");}catch(e){document.documentElement.setAttribute("lang","en");document.documentElement.setAttribute("dir","ltr");}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pages.404.page_title">Page not found | MenuCodes</title>
<meta name="description" data-i18n-attr="content:pages.404.meta_description" content="The page you're looking for doesn't exist. Head back home to explore the MenuCodes digital menu system">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<style>
.nf{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:var(--space-8) var(--gutter);}
.nf__code{font-family:var(--font-display);font-size:clamp(4rem,14vw,8rem);font-weight:700;color:var(--color-ghost);line-height:1;margin-bottom:var(--space-4);}
.nf h1{margin-bottom:var(--space-4);}
.nf p{color:var(--color-muted);margin-bottom:var(--space-8);}
</style>
<noscript><style>html:not([data-i18n-ready]) body{visibility:visible!important}</style></noscript>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="aria.skip_link">Skip to main content</a>
<main id="main" class="nf">
  <div>
    <div class="nf__code" aria-hidden="true">404</div>
    <h1 data-i18n="pages.404.heading">Page not found</h1>
    <p data-i18n="pages.404.copy">The page you're looking for moved or never existed</p>
    <a class="btn btn--gold" href="./" data-i18n="pages.404.button">Back to home</a>
  </div>
</main>
<script src="assets/js/dictionary.js"></script>
<script src="assets/js/i18n.js"></script>
</body>
</html>
